4E9F1\"><span>Lipid panel<\u002Fspan><span style=\"color: #4A5A70\">Oct 14, 2026<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #E4E9F1\"><span>Comprehensive metabolic panel<\u002Fspan><span style=\"color: #4A5A70\">Oct 14, 2026<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #E4E9F1\"><span>Ferritin and iron panel<\u002Fspan><span style=\"color: #4A5A70\">Jul 30, 2026<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 16px 20px\"><span>Chest X-ray, 2 views<\u002Fspan><span style=\"color: #4A5A70\">May 5, 2026<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top: 18px; color: #4A5A70; font-size: 13px\">Pretend portal page for illustration only.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ext.open}}\" hint-placeholder-val=\"{{true}}\">\n<div role=\"dialog\" aria-label=\"Everkeep extension\" style=\"position: absolute; top: 108px; right: 16px; box-sizing: border-box; width: 400px; max-width: calc(100% - 32px); background: #FFFFFF; border: 1px solid #B9ADD3; border-radius: 16px; box-shadow: 0 16px 40px rgba(30, 21, 52, 0.32); padding: 22px\">\n<div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 16px\">\n<div style=\"width: 30px; height: 30px; border-radius: 9px; background: #5B2FA6; display: flex; align-items: center; justify-content: center\">\n<svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z\"><\u002Fpath><path d=\"M8.5 12l2.5 2.5 4.5-5\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<span style=\"font-family: 'Fraunces', Georgia, serif; font-size: 21px; font-weight: 600\">Everkeep<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: inline-block; padding: 3px 10px; border-radius: 12px; background: #EFE8FB; color: #43207F; font-size: 13px; font-weight: 700; margin-bottom: 10px\">Patient portal detected<\u002Fdiv>\n<h1 style=\"margin: 0 0 6px; font-size: 20px; line-height: 1.25\">Connect Mesa Valley Health to Everkeep?<\u002Fh1>\n<p style=\"margin: 0 0 16px; color: #5A5170\">You are signed in. Everkeep can copy your records from this portal into your library.<\u002Fp>\n<div style=\"border: 1px solid #E8E2F3; border-radius: 12px; padding: 4px 16px; margin-bottom: 14px\">\n<div style=\"display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #E8E2F3\"><span>Lab panels<\u002Fspan><span style=\"font-weight: 700\">4<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #E8E2F3\"><span>Visit notes<\u002Fspan><span style=\"font-weight: 700\">1<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid #E8E2F3\"><span>Medications and immunizations<\u002Fspan><span style=\"font-weight: 700\">2<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; padding: 9px 0\"><span>Imaging studies<\u002Fspan><span style=\"font-weight: 700\">1<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<label style=\"display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #F6F3FB; margin-bottom: 16px; cursor: pointer\">\n<input type=\"checkbox\" checked=\"\" style=\"width: 22px; height: 22px; margin: 1px 0 0; accent-color: #5B2FA6; flex: 0 0 auto\">\n<span><strong>Also bring in the actual images<\u002Fstrong><br><span style=\"color: #5A5170; font-size: 14px\">The chest X-ray links to an imaging viewer. Everkeep will save its 2 images.<\u002Fspan><\u002Fspan>\n<\u002Flabel>\n<button type=\"button\" sc-camel-on-click=\"{{ext.connect}}\" style=\"width: 100%; min-height: 46px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 8px\">Connect and import<\u002Fbutton>\n<div style=\"display: flex; gap: 8px; margin-bottom: 14px\">\n<button type=\"button\" sc-camel-on-click=\"{{ext.close}}\" style=\"flex: 1; min-height: 44px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Not now<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ext.close}}\" style=\"flex: 1; min-height: 44px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Never on this site<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 13px\">Everkeep only reads pages while you are signed in. Your portal password stays in your browser and is never sent to Everkeep.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.app}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: flex; flex-wrap: wrap; min-height: 1180px\">\n\n<nav aria-label=\"Primary\" style=\"flex: 1 1 248px; max-width: 280px; box-sizing: border-box; padding: 24px 16px; background: #FFFFFF; border-right: 1px solid #DDD5EC; display: flex; flex-direction: column; gap: 4px\">\n<button type=\"button\" sc-camel-on-click=\"{{nav.goHome}}\" style=\"display: flex; align-items: center; gap: 10px; padding: 4px 12px 24px; border: none; background: transparent; cursor: pointer; text-align: left\">\n<span style=\"width: 34px; height: 34px; border-radius: 10px; background: #5B2FA6; display: flex; align-items: center; justify-content: center\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l8 3v6c0 4.5-3.2 7.8-8 9-4.8-1.2-8-4.5-8-9V6z\"><\u002Fpath><path d=\"M8.5 12l2.5 2.5 4.5-5\"><\u002Fpath><\u002Fsvg>\n<\u002Fspan>\n<span style=\"font-family: 'Fraunces', Georgia, serif; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; color: #1E1534\">Everkeep<\u002Fspan>\n<\u002Fbutton>\n\n<button type=\"button\" sc-camel-on-click=\"{{nav.goHome}}\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{nav.homeBg}}; color: {{nav.homeFg}}; font-size: 15px; font-weight: {{nav.homeFw}}; cursor: pointer; text-align: left\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 11l8-7 8 7v9H4z\"><\u002Fpath><path d=\"M10 20v-6h4v6\"><\u002Fpath><\u002Fsvg>\nHome<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{nav.goRecords}}\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{nav.recordsBg}}; color: {{nav.recordsFg}}; font-size: 15px; font-weight: {{nav.recordsFw}}; cursor: pointer; text-align: left\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 3h8l4 4v14H6z\"><\u002Fpath><path d=\"M14 3v4h4M9 12h6M9 16h6\"><\u002Fpath><\u002Fsvg>\nRecords<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{nav.goLabs}}\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{nav.labsBg}}; color: {{nav.labsFg}}; font-size: 15px; font-weight: {{nav.labsFw}}; cursor: pointer; text-align: left\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M4 4v16h16\"><\u002Fpath><path d=\"M8 15l3-4 3 2 5-6\"><\u002Fpath><\u002Fsvg>\nLabs<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{nav.goImaging}}\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{nav.imagingBg}}; color: {{nav.imagingFg}}; font-size: 15px; font-weight: {{nav.imagingFw}}; cursor: pointer; text-align: left\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><\u002Fsvg>\nImaging<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{nav.goRequests}}\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{nav.requestsBg}}; color: {{nav.requestsFg}}; font-size: 15px; font-weight: {{nav.requestsFw}}; cursor: pointer; text-align: left\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"><\u002Frect><path d=\"M3 7l9 6 9-6\"><\u002Fpath><\u002Fsvg>\n<span style=\"flex: 1\">Requests<\u002Fspan>\n<sc-if value=\"{{nav.badgeShow}}\" hint-placeholder-val=\"{{true}}\">\n<span style=\"min-width: 22px; height: 22px; border-radius: 11px; background: #FDEFD6; color: #7A3F06; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{nav.badge}}<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{nav.goConnections}}\" style=\"display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 12px; border: none; border-radius: 10px; background: {{nav.connectionsBg}}; color: {{nav.connectionsFg}}; font-size: 15px; font-weight: {{nav.connectionsFw}}; cursor: pointer; text-align: left\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3v5M15 3v5M7 8h10v3a5 5 0 01-10 0zM12 16v5\"><\u002Fpath><\u002Fsvg>\nConnections<\u002Fbutton>\n<\u002Fnav>\n\n<main style=\"flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 56px\">\n\n<sc-if value=\"{{v.home}}\" hint-placeholder-val=\"{{true}}\">\n<div>\n<section style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: center; margin-bottom: 56px\">\n<div style=\"flex: 1 1 400px; min-width: 0\">\n<div style=\"color: #5B2FA6; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px\">Everkeep<\u002Fdiv>\n<h1 style=\"margin: 0 0 16px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 52px; line-height: 1.08; letter-spacing: -0.015em\">Your medical records, finally in one place.<\u002Fh1>\n<p style=\"margin: 0 0 28px; max-width: 540px; font-size: 18px; color: #3B3254\">Your health history is scattered across patient portals, imaging sites and old letters. Everkeep gathers it, organizes it with tags, shows how your labs change over time, and helps you ask for whatever is missing.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<button type=\"button\" sc-camel-on-click=\"{{home.connect}}\" style=\"min-height: 48px; padding: 0 24px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer\">Connect a clinic portal<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{home.labs}}\" style=\"min-height: 48px; padding: 0 24px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 16px; font-weight: 600; cursor: pointer\">Explore your labs<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 360px; min-width: 0; box-sizing: border-box; padding: 28px; border-radius: 20px; background: #EFE8FB\">\n<div style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #43207F; margin-bottom: 12px\">Where your records live today<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<span style=\"padding: 8px 14px; border-radius: 18px; background: #FFFFFF; font-weight: 600; font-size: 14px\">Clinic portals<\u002Fspan>\n<span style=\"padding: 8px 14px; border-radius: 18px; background: #FFFFFF; font-weight: 600; font-size: 14px\">Imaging portals<\u002Fspan>\n<span style=\"padding: 8px 14px; border-radius: 18px; background: #FFFFFF; font-weight: 600; font-size: 14px\">Lab companies<\u002Fspan>\n<span style=\"padding: 8px 14px; border-radius: 18px; background: #FFFFFF; font-weight: 600; font-size: 14px\">Records you request<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; justify-content: center; padding: 10px 0\" aria-hidden=\"true\">\n<svg width=\"28\" height=\"36\" sc-camel-view-box=\"0 0 28 36\" fill=\"none\" stroke=\"#5B2FA6\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 4v26M6 22l8 8 8-8\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 14px; padding: 18px 20px\">\n<div style=\"font-family: 'Fraunces', Georgia, serif; font-size: 20px; font-weight: 600; margin-bottom: 10px\">Your Everkeep library<\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #E8E2F3\"><span>TSH over 3 years<\u002Fspan><span style=\"color: #5A5170\">Graph<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid #E8E2F3\"><span>Chest X-ray<\u002Fspan><span style=\"color: #5A5170\">2 images<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid #E8E2F3\"><span>Tilt table test report<\u002Fspan><span style=\"padding: 2px 10px; border-radius: 12px; background: #D6EFEC; color: #0A4F4A; font-size: 13px; font-weight: 600\">POTS<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"margin-bottom: 56px\">\n<h2 style=\"margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px\">What Everkeep does for you<\u002Fh2>\n<p style=\"margin: 0 0 22px; color: #5A5170\">Open any card to try it.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n<button type=\"button\" sc-camel-on-click=\"{{home.toConnections}}\" style=\"flex: 1 1 300px; box-sizing: border-box; text-align: left; padding: 24px; border: 1px solid #DDD5EC; border-radius: 16px; background: #FFFFFF; color: #1E1534; cursor: pointer\">\n<span style=\"display: block; font-size: 19px; font-weight: 700; margin-bottom: 6px\">Pulls your records in for you<\u002Fspan>\n<span style=\"display: block; color: #3B3254; margin-bottom: 12px\">A browser extension notices when you are signed in to a medical portal and offers to connect it. It saves imaging too, not just reports.<\u002Fspan>\n<span style=\"color: #5B2FA6; font-weight: 700\">Connections<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{home.labs}}\" style=\"flex: 1 1 300px; box-sizing: border-box; text-align: left; padding: 24px; border: 1px solid #DDD5EC; border-radius: 16px; background: #FFFFFF; color: #1E1534; cursor: pointer\">\n<span style=\"display: block; font-size: 19px; font-weight: 700; margin-bottom: 6px\">Shows labs as a story<\u002Fspan>\n<span style=\"display: block; color: #3B3254; margin-bottom: 12px\">Every result for a test lands on one graph over time, not in a pile of separate entries.<\u002Fspan>\n<span style=\"color: #5B2FA6; font-weight: 700\">Labs<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{home.toRequests}}\" style=\"flex: 1 1 300px; box-sizing: border-box; text-align: left; padding: 24px; border: 1px solid #DDD5EC; border-radius: 16px; background: #FFFFFF; color: #1E1534; cursor: pointer\">\n<span style=\"display: block; font-size: 19px; font-weight: 700; margin-bottom: 6px\">Chases down what is missing<\u002Fspan>\n<span style=\"display: block; color: #3B3254; margin-bottom: 12px\">Write to a clinic's records team, track every request, and send follow-ups with one click.<\u002Fspan>\n<span style=\"color: #5B2FA6; font-weight: 700\">Requests<\u002Fspan>\n<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{home.toRecords}}\" style=\"flex: 1 1 300px; box-sizing: border-box; text-align: left; padding: 24px; border: 1px solid #DDD5EC; border-radius: 16px; background: #FFFFFF; color: #1E1534; cursor: pointer\">\n<span style=\"display: block; font-size: 19px; font-weight: 700; margin-bottom: 6px\">Organizes with tags<\u002Fspan>\n<span style=\"display: block; color: #3B3254; margin-bottom: 12px\">Tag records with labels like POTS, gastroparesis or cardiology, filter by them, and fix clinic names that imported wrong.<\u002Fspan>\n<span style=\"color: #5B2FA6; font-weight: 700\">Records<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section>\n<h2 style=\"margin: 0 0 22px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px\">How it works<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n<div style=\"flex: 1 1 260px; box-sizing: border-box; padding: 22px; border-radius: 16px; background: #EFE8FB\">\n<div style=\"width: 32px; height: 32px; border-radius: 16px; background: #5B2FA6; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 10px\">1<\u002Fdiv>\n<div style=\"font-weight: 700; margin-bottom: 4px\">Connect a portal<\u002Fdiv>\n<div style=\"color: #3B3254\">Sign in to your clinic's portal as usual. Everkeep asks before it copies anything.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; box-sizing: border-box; padding: 22px; border-radius: 16px; background: #EFE8FB\">\n<div style=\"width: 32px; height: 32px; border-radius: 16px; background: #5B2FA6; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 10px\">2<\u002Fdiv>\n<div style=\"font-weight: 700; margin-bottom: 4px\">Review what came in<\u002Fdiv>\n<div style=\"color: #3B3254\">Fix the clinic name, add tags, and leave out anything you do not want.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; box-sizing: border-box; padding: 22px; border-radius: 16px; background: #EFE8FB\">\n<div style=\"width: 32px; height: 32px; border-radius: 16px; background: #5B2FA6; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 10px\">3<\u002Fdiv>\n<div style=\"font-weight: 700; margin-bottom: 4px\">Keep it, forever<\u002Fdiv>\n<div style=\"color: #3B3254\">Your records stay in one place, with trends, images and requests alongside them.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 24px 0 0; color: #5A5170; font-size: 14px\">Sample data and a simulated portal connection are used throughout this prototype.<\u002Fp>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.records}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px\">\n<div>\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">Records<\u002Fh1>\n<p style=\"margin: 0; color: #5A5170\">Everything from every portal, together and in order.<\u002Fp>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{rec.connect}}\" style=\"min-height: 44px; padding: 0 20px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">Connect a portal<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{rec.showNotConnected}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 16px 20px; border-radius: 14px; background: #FDEFD6; border: 1px solid #EBC98E; margin-bottom: 20px\">\n<div style=\"flex: 1 1 280px; color: #5E3005\"><strong>Mesa Valley Health is not connected yet.<\u002Fstrong> Connect it to bring in your latest labs, notes and imaging.<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{rec.connect}}\" style=\"min-height: 44px; padding: 0 18px; border: none; border-radius: 10px; background: #5E3005; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">Connect now<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{rec.showNew}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding: 16px 20px; border-radius: 14px; background: #D6EFEC; color: #063F3A; margin-bottom: 20px\"><strong>{{rec.newCount}} records from {{rec.clinicName}} are now in your library.<\u002Fstrong> They are marked New.<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px\" role=\"group\" aria-label=\"Filter by tag\">\n<span style=\"font-weight: 600; margin-right: 4px\">Tags<\u002Fspan>\n<sc-for list=\"{{chips}}\" as=\"c\" hint-placeholder-count=\"4\">\n<button type=\"button\" sc-camel-on-click=\"{{c.pick}}\" aria-pressed=\"{{c.selected}}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{c.bd}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 15px; font-weight: 600; cursor: pointer\">{{c.label}} <span style=\"font-weight: 500; opacity: 0.85\">{{c.count}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n\n<div style=\"background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 14px; overflow-x: auto\">\n<div style=\"min-width: 760px\">\n<div style=\"display: grid; grid-template-columns: 120px minmax(0, 2.2fr) minmax(0, 1.6fr) minmax(0, 1.4fr); column-gap: 16px; padding: 14px 24px; border-bottom: 1px solid #DDD5EC; color: #5A5170; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase\">\n<div>Date<\u002Fdiv><div>Record<\u002Fdiv><div>Clinic<\u002Fdiv><div>Tags<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n<button type=\"button\" sc-camel-on-click=\"{{r.open}}\" style=\"box-sizing: border-box; width: 100%; text-align: left; display: grid; grid-template-columns: 120px minmax(0, 2.2fr) minmax(0, 1.6fr) minmax(0, 1.4fr); column-gap: 16px; align-items: center; min-height: 64px; padding: 10px 24px; border: none; border-bottom: 1px solid #EDE8F6; background: #FFFFFF; color: #1E1534; font-size: 15px; cursor: pointer\">\n<span style=\"color: #5A5170\">{{r.date}}<\u002Fspan>\n<span>\n<span style=\"display: block; font-weight: 600\">{{r.title}}<\u002Fspan>\n<span style=\"display: block; color: #5A5170; font-size: 13px\">{{r.kind}}<\u002Fspan>\n<\u002Fspan>\n<span style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 8px\">\n<span>{{r.clinic}}<\u002Fspan>\n<sc-if value=\"{{r.isNew}}\" hint-placeholder-val=\"{{false}}\">\n<span style=\"padding: 2px 8px; border-radius: 6px; background: #EFE8FB; color: #43207F; font-size: 12px; font-weight: 700\">New<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fspan>\n<span style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<sc-for list=\"{{r.tags}}\" as=\"t\" hint-placeholder-count=\"1\">\n<span style=\"padding: 3px 10px; border-radius: 12px; background: {{t.bg}}; color: {{t.fg}}; font-size: 13px; font-weight: 600\">{{t.label}}<\u002Fspan>\n<\u002Fsc-for>\n<sc-if value=\"{{r.untagged}}\" hint-placeholder-val=\"{{false}}\">\n<span style=\"color: #5A5170; font-size: 13px\">Add a tag<\u002Fspan>\n<\u002Fsc-if>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 14px 4px 0; color: #5A5170; font-size: 14px\">Showing {{rec.count}} of {{rec.total}} records. Sample data shown for design purposes.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.record}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<div style=\"margin-bottom: 16px; font-size: 14px; color: #5A5170\">\n<button type=\"button\" sc-camel-on-click=\"{{det.back}}\" style=\"min-height: 44px; padding: 0; border: none; background: transparent; color: #5B2FA6; font-size: 14px; font-weight: 600; cursor: pointer\">Records<\u002Fbutton> / {{det.title}}\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<section style=\"flex: 3 1 420px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 28px\">\n<div style=\"color: #5A5170; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px\">{{det.kind}} · {{det.date}}<\u002Fdiv>\n<h1 style=\"margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 34px; letter-spacing: -0.01em\">{{det.title}}<\u002Fh1>\n<div style=\"color: #5A5170; margin-bottom: 22px\">{{det.source}}<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 24px\">\n<sc-if value=\"{{det.hasLab}}\" hint-placeholder-val=\"{{false}}\">\n<button type=\"button\" sc-camel-on-click=\"{{det.openLab}}\" style=\"min-height: 44px; padding: 0 18px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">See trend over time<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{det.hasStudy}}\" hint-placeholder-val=\"{{false}}\">\n<button type=\"button\" sc-camel-on-click=\"{{det.openStudy}}\" style=\"min-height: 44px; padding: 0 18px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">Open images<\u002Fbutton>\n<\u002Fsc-if>\n<button type=\"button\" style=\"min-height: 44px; padding: 0 18px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Download original<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px\">Report text from the portal<\u002Fdiv>\n<div style=\"box-sizing: border-box; border: 1px dashed #B9ADD3; border-radius: 12px; padding: 20px; background: #FAF8FD; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"height: 10px; width: 92%; border-radius: 5px; background: #E4DCF2\"><\u002Fdiv>\n<div style=\"height: 10px; width: 78%; border-radius: 5px; background: #E4DCF2\"><\u002Fdiv>\n<div style=\"height: 10px; width: 86%; border-radius: 5px; background: #E4DCF2\"><\u002Fdiv>\n<div style=\"height: 10px; width: 54%; border-radius: 5px; background: #E4DCF2\"><\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 14px; margin-top: 6px\">The full report appears here as imported, unchanged. Only the details on the right are editable.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<aside style=\"flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<section style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 24px\">\n<h2 style=\"margin: 0 0 16px; font-size: 18px; font-weight: 700\">Details<\u002Fh2>\n<label for=\"clinic\" style=\"display: block; font-weight: 600; margin-bottom: 6px\">Clinic<\u002Flabel>\n<input id=\"clinic\" type=\"text\" value=\"{{det.clinic}}\" sc-camel-on-change=\"{{det.setClinic}}\" style=\"box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; font: inherit; color: #1E1534; margin-bottom: 10px\">\n<button type=\"button\" sc-camel-on-click=\"{{det.applyAll}}\" style=\"width: 100%; min-height: 44px; border: 1px solid #5B2FA6; border-radius: 10px; background: #FFFFFF; color: #43207F; font-size: 15px; font-weight: 600; cursor: pointer\">{{det.applyLabel}}<\u002Fbutton>\n<div style=\"margin-top: 10px; color: #5A5170; font-size: 14px\">{{det.applyNote}}<\u002Fdiv>\n<\u002Fsection>\n<section style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 24px\">\n<h2 style=\"margin: 0 0 4px; font-size: 18px; font-weight: 700\">Tags<\u002Fh2>\n<p style=\"margin: 0 0 16px; color: #5A5170\">Tag this record, then filter your whole library by tag.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; align-items: center\" role=\"group\" aria-label=\"Tags\">\n<sc-for list=\"{{det.tags}}\" as=\"t\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{t.remove}}\" aria-label=\"Remove tag {{t.label}}\" style=\"min-height: 44px; padding: 0 14px 0 16px; border-radius: 22px; border: 2px solid {{t.fg}}; background: {{t.bg}}; color: {{t.fg}}; font-size: 15px; font-weight: 600; cursor: pointer\">{{t.label}} <span aria-hidden=\"true\">×<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<sc-if value=\"{{det.noTags}}\" hint-placeholder-val=\"{{false}}\">\n<span style=\"color: #5A5170; font-size: 14px\">No tags yet<\u002Fspan>\n<\u002Fsc-if>\n<button type=\"button\" sc-camel-on-click=\"{{det.toggleMenu}}\" aria-expanded=\"{{det.menuOpen}}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px dashed #5B2FA6; background: #FFFFFF; color: #43207F; font-size: 15px; font-weight: 600; cursor: pointer\">+ Add tag<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{det.menuOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"margin-top: 12px; border: 1px solid #B9ADD3; border-radius: 12px; background: #FFFFFF; box-shadow: 0 8px 24px rgba(30, 21, 52, 0.14); overflow: hidden\">\n<div style=\"padding: 10px 16px; background: #F6F3FB; color: #5A5170; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase\">Add one of your tags<\u002Fdiv>\n<sc-for list=\"{{det.menu}}\" as=\"m\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{m.add}}\" style=\"display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 0 16px; border: none; border-top: 1px solid #EDE8F6; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer\"><span aria-hidden=\"true\" style=\"width: 14px; height: 14px; border-radius: 7px; background: {{m.bg}}; border: 2px solid {{m.fg}}\"><\u002Fspan>{{m.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<sc-if value=\"{{det.menuEmpty}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding: 14px 16px; color: #5A5170; font-size: 14px\">This record already has all of your tags.<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{det.createClosed}}\" hint-placeholder-val=\"{{true}}\">\n<button type=\"button\" sc-camel-on-click=\"{{det.openCreate}}\" style=\"display: flex; align-items: center; width: 100%; min-height: 48px; padding: 0 16px; border: none; border-top: 1px solid #EDE8F6; background: #FAF8FD; color: #43207F; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer\">+ Create new tag<\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{det.createOpen}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding: 16px; border-top: 1px solid #EDE8F6; background: #FAF8FD\">\n<label for=\"newtag\" style=\"display: block; font-weight: 600; margin-bottom: 6px\">Tag name<\u002Flabel>\n<input id=\"newtag\" type=\"text\" placeholder=\"For example, Migraine\" value=\"{{det.newName}}\" sc-camel-on-change=\"{{det.setName}}\" style=\"box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; font: inherit; color: #1E1534\">\n<div style=\"font-weight: 600; margin: 14px 0 8px\">Color<\u002Fdiv>\n<div role=\"group\" aria-label=\"Tag color\" style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<sc-for list=\"{{det.swatches}}\" as=\"w\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{w.pick}}\" aria-label=\"{{w.name}}\" aria-pressed=\"{{w.on}}\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 3px solid {{w.bd}}; background: {{w.bg}}; color: {{w.fg}}; font-size: 16px; font-weight: 700; cursor: pointer\">{{w.mark}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin: 14px 0\">Preview <span style=\"display: inline-block; margin-left: 8px; padding: 4px 12px; border-radius: 14px; background: {{det.previewBg}}; color: {{det.previewFg}}; font-size: 14px; font-weight: 600\">{{det.previewLabel}}<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<button type=\"button\" sc-camel-on-click=\"{{det.create}}\" disabled=\"{{det.createDisabled}}\" style=\"min-height: 44px; padding: 0 18px; border: none; border-radius: 10px; background: {{det.createBg}}; color: {{det.createFg}}; font-size: 15px; font-weight: 700; cursor: pointer\">Create and add<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{det.cancelCreate}}\" style=\"min-height: 44px; padding: 0 18px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Cancel<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.labs}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">Labs<\u002Fh1>\n<p style=\"margin: 0 0 24px; color: #5A5170\">Pick a test to see every result on one graph over time.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n<sc-for list=\"{{labCards}}\" as=\"l\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{l.open}}\" style=\"flex: 1 1 300px; max-width: 420px; box-sizing: border-box; text-align: left; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 14px; padding: 20px; color: #1E1534; cursor: pointer\">\n<span style=\"display: block; font-weight: 700; font-size: 17px\">{{l.name}}<\u002Fspan>\n<span style=\"display: block; font-size: 26px; font-weight: 700; margin: 6px 0 2px\">{{l.latest}} <span style=\"font-size: 14px; font-weight: 500; color: #5A5170\">{{l.unit}}<\u002Fspan><\u002Fspan>\n<span style=\"display: block; color: #5A5170; font-size: 13px; margin-bottom: 8px\">{{l.change}} · {{l.status}}<\u002Fspan>\n<svg sc-camel-view-box=\"0 0 260 64\" width=\"260\" height=\"64\" role=\"img\" aria-label=\"{{l.alt}}\" style=\"display: block; width: 100%; height: auto\"><polyline points=\"{{l.spark}}\" fill=\"none\" stroke=\"#5B2FA6\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline><\u002Fsvg>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 18px 4px 0; color: #5A5170; font-size: 14px\">Sample data shown for design purposes. Reference ranges come from each lab report, not from Everkeep.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.lab}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<div style=\"margin-bottom: 16px; font-size: 14px; color: #5A5170\">\n<button type=\"button\" sc-camel-on-click=\"{{lab.back}}\" style=\"min-height: 44px; padding: 0; border: none; background: transparent; color: #5B2FA6; font-size: 14px; font-weight: 600; cursor: pointer\">Labs<\u002Fbutton> / {{lab.name}}\n<\u002Fdiv>\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">{{lab.name}} over time<\u002Fh1>\n<p style=\"margin: 0 0 24px; color: #5A5170\">{{lab.sub}}<\u002Fp>\n\n<sc-if value=\"{{lab.hasNew}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"padding: 14px 18px; border-radius: 12px; background: #FDEFD6; color: #5E3005; margin-bottom: 20px\"><strong>{{lab.newCount}} new results<\u002Fstrong> from {{lab.clinicName}} were added by your import. They are shown in orange.<\u002Fdiv>\n<\u002Fsc-if>\n\n<section style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 28px; margin-bottom: 24px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px; margin-bottom: 24px\">\n<div>\n<div style=\"color: #5A5170; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">Latest<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 700; line-height: 1.15\">{{lab.latest}} <span style=\"font-size: 15px; font-weight: 500; color: #5A5170\">{{lab.unit}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"color: #5A5170; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">Since {{lab.firstLabel}}<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 700; line-height: 1.15\">{{lab.change}} <span style=\"font-size: 15px; font-weight: 500; color: #5A5170\">{{lab.unit}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<div style=\"color: #5A5170; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em\">Reference range<\u002Fdiv>\n<div style=\"font-size: 30px; font-weight: 700; line-height: 1.15\">{{lab.refText}} <span style=\"font-size: 15px; font-weight: 500; color: #5A5170\">{{lab.unit}}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin-bottom: 14px; font-weight: 600\" aria-live=\"polite\">{{lab.selText}}<\u002Fdiv>\n\n<div style=\"margin: 0 0 40px 54px\">\n<div style=\"position: relative; width: 100%; aspect-ratio: 900 / 320\">\n<svg sc-camel-view-box=\"0 0 900 320\" sc-camel-preserve-aspect-ratio=\"none\" role=\"img\" aria-label=\"{{lab.alt}}\" style=\"position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: visible\">\n<rect x=\"0\" y=\"{{lab.bandY}}\" width=\"900\" height=\"{{lab.bandH}}\" fill=\"#EFE8FB\"><\u002Frect>\n<path d=\"{{lab.grid}}\" stroke=\"#DDD5EC\" stroke-width=\"1\" fill=\"none\"><\u002Fpath>\n<polyline points=\"{{lab.line}}\" fill=\"none\" stroke=\"#5B2FA6\" stroke-width=\"3\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><\u002Fpolyline>\n<path d=\"{{lab.dots}}\" stroke=\"#FFFFFF\" stroke-width=\"18\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath>\n<path d=\"{{lab.dots}}\" stroke=\"#5B2FA6\" stroke-width=\"10\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath>\n<path d=\"{{lab.newDots}}\" stroke=\"#FFFFFF\" stroke-width=\"18\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath>\n<path d=\"{{lab.newDots}}\" stroke=\"#B4690E\" stroke-width=\"10\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath>\n<path d=\"{{lab.selDot}}\" stroke=\"#1E1534\" stroke-width=\"26\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath>\n<path d=\"{{lab.selDot}}\" stroke=\"#FFFFFF\" stroke-width=\"18\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath>\n<path d=\"{{lab.selDot}}\" stroke=\"{{lab.selColor}}\" stroke-width=\"10\" stroke-linecap=\"round\" fill=\"none\"><\u002Fpath>\n<\u002Fsvg>\n<div style=\"position: absolute; left: 10px; top: {{lab.bandLabelTop}}%; color: #43207F; font-size: 13px; font-weight: 700\">Reference range<\u002Fdiv>\n<sc-for list=\"{{lab.yLabels}}\" as=\"y\" hint-placeholder-count=\"5\">\n<div style=\"position: absolute; left: -54px; width: 44px; text-align: right; top: {{y.top}}%; transform: translateY(-50%); color: #5A5170; font-size: 13px\">{{y.text}}<\u002Fdiv>\n<\u002Fsc-for>\n<sc-for list=\"{{lab.xLabels}}\" as=\"x\" hint-placeholder-count=\"4\">\n<div style=\"position: absolute; top: 100%; margin-top: 10px; left: {{x.left}}%; transform: translateX(-50%); color: #5A5170; font-size: 13px; white-space: nowrap\">{{x.text}}<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-weight: 700; margin-bottom: 10px\">All results<\u002Fdiv>\n<div style=\"border: 1px solid #E8E2F3; border-radius: 12px; overflow-x: auto\">\n<div style=\"min-width: 520px\">\n<sc-for list=\"{{lab.rows}}\" as=\"r\" hint-placeholder-count=\"6\">\n<button type=\"button\" sc-camel-on-click=\"{{r.pick}}\" aria-pressed=\"{{r.selected}}\" style=\"box-sizing: border-box; width: 100%; text-align: left; display: grid; grid-template-columns: 130px 130px 120px minmax(0, 1fr); column-gap: 12px; align-items: center; min-height: 48px; padding: 8px 16px; border: none; border-bottom: 1px solid #EDE8F6; background: {{r.bg}}; color: #1E1534; font-size: 15px; cursor: pointer\">\n<span>{{r.date}}<\u002Fspan>\n<span style=\"font-weight: 700\">{{r.value}}<\u002Fspan>\n<span style=\"color: #3B3254\">{{r.status}}<\u002Fspan>\n<span style=\"display: flex; flex-wrap: wrap; gap: 8px; align-items: center\"><span>{{r.clinic}}<\u002Fspan>\n<sc-if value=\"{{r.isNew}}\" hint-placeholder-val=\"{{false}}\"><span style=\"padding: 2px 8px; border-radius: 6px; background: #FDEFD6; color: #5E3005; font-size: 12px; font-weight: 700\">New<\u002Fspan><\u002Fsc-if><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<p style=\"margin: 0 4px; color: #5A5170; font-size: 14px\">Sample data shown for design purposes. Reference ranges come from each lab report, not from Everkeep.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.imaging}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">Imaging<\u002Fh1>\n<p style=\"margin: 0 0 28px; color: #5A5170\">The actual images from your scans, saved next to their reports.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<section aria-label=\"Studies\" style=\"flex: 1 1 280px; max-width: 380px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{img.studies}}\" as=\"st\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{st.pick}}\" aria-pressed=\"{{st.selected}}\" style=\"box-sizing: border-box; width: 100%; text-align: left; padding: 16px 18px; border-radius: 14px; border: 2px solid {{st.bd}}; background: #FFFFFF; color: #1E1534; cursor: pointer\">\n<span style=\"display: block; font-weight: 700\">{{st.title}}<\u002Fspan>\n<span style=\"display: block; color: #5A5170; font-size: 14px\">{{st.date}} · {{st.clinic}}<\u002Fspan>\n<span style=\"display: flex; gap: 8px; margin-top: 8px\"><span style=\"padding: 2px 9px; border-radius: 11px; background: #EFE8FB; color: #43207F; font-size: 13px; font-weight: 700\">{{st.count}} images saved<\u002Fspan><span style=\"padding: 2px 9px; border-radius: 11px; background: {{st.tagBg}}; color: {{st.tagFg}}; font-size: 13px; font-weight: 600\">{{st.tag}}<\u002Fspan><\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<sc-if value=\"{{img.showConnect}}\" hint-placeholder-val=\"{{true}}\">\n<div style=\"box-sizing: border-box; padding: 16px 18px; border-radius: 14px; border: 1px dashed #B9ADD3; background: #FAF8FD\">\n<div style=\"font-weight: 700\">Chest X-ray<\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 14px; margin-bottom: 8px\">Listed in Mesa Valley Health's portal. Connect it to save the images.<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{img.connect}}\" style=\"min-height: 44px; padding: 0; border: none; background: transparent; color: #5B2FA6; font-size: 14px; font-weight: 700; cursor: pointer\">Connect Mesa Valley Health<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fsection>\n<section aria-label=\"Image viewer\" style=\"flex: 3 1 480px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 20px\">\n<div style=\"margin-bottom: 14px\">\n<div style=\"font-weight: 700; font-size: 18px\">{{img.title}}<\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 14px\">Saved from the imaging portal<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position: relative; height: 480px; border-radius: 12px; overflow: hidden; background: {{img.bg}}\">\n<div style=\"position: absolute; top: 14px; left: 16px; color: {{img.fg}}; font-size: 14px; font-weight: 600\">{{img.viewName}}<\u002Fdiv>\n<div style=\"position: absolute; top: 14px; right: 16px; color: {{img.fg}}; font-size: 14px; font-weight: 600\">Image {{img.num}} of {{img.total}}<\u002Fdiv>\n<div style=\"position: absolute; bottom: 14px; left: 16px; color: {{img.fg}}; font-size: 13px\">Placeholder preview. Your saved image appears here.<\u002Fdiv>\n<div style=\"position: absolute; bottom: 14px; right: 16px; color: {{img.fg}}; font-size: 13px\">{{img.mode}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px\">\n<button type=\"button\" aria-label=\"Zoom out\" style=\"min-width: 44px; min-height: 44px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 20px; font-weight: 600; cursor: pointer\">−<\u002Fbutton>\n<button type=\"button\" aria-label=\"Zoom in\" style=\"min-width: 44px; min-height: 44px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 20px; font-weight: 600; cursor: pointer\">+<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{img.toggleInvert}}\" aria-pressed=\"{{img.invert}}\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid {{img.invBd}}; border-radius: 10px; background: {{img.invBg}}; color: {{img.invFg}}; font-size: 15px; font-weight: 600; cursor: pointer\">Invert<\u002Fbutton>\n<button type=\"button\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Download original files<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px\" role=\"group\" aria-label=\"Images in this study\">\n<sc-for list=\"{{img.thumbs}}\" as=\"t\" hint-placeholder-count=\"2\">\n<button type=\"button\" sc-camel-on-click=\"{{t.pick}}\" aria-label=\"{{t.label}}\" aria-pressed=\"{{t.selected}}\" style=\"box-sizing: border-box; width: 80px; height: 80px; border-radius: 10px; border: 3px solid {{t.bd}}; background: {{t.bg}}; cursor: pointer; padding: 0\"><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top: 16px; padding-top: 14px; border-top: 1px solid #E8E2F3; color: #5A5170; font-size: 14px\">Everkeep is a place to keep and look at your images. It is not a diagnostic viewer. Ask your clinician to review your scans.<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.requests}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px\">\n<div>\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">Requests<\u002Fh1>\n<p style=\"margin: 0; color: #5A5170\">Every record you have asked for, and what needs a nudge.<\u002Fp>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{req.newRequest}}\" style=\"min-height: 44px; padding: 0 20px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">New request<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<section aria-label=\"All requests\" style=\"flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<sc-for list=\"{{reqRows}}\" as=\"r\" hint-placeholder-count=\"5\">\n<button type=\"button\" sc-camel-on-click=\"{{r.pick}}\" aria-pressed=\"{{r.selected}}\" style=\"box-sizing: border-box; width: 100%; text-align: left; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; min-height: 76px; padding: 14px 20px; border-radius: 14px; border: 2px solid {{r.bd}}; background: #FFFFFF; color: #1E1534; font-size: 15px; cursor: pointer\">\n<span style=\"flex: 1 1 200px; min-width: 0\">\n<span style=\"display: block; font-weight: 700\">{{r.title}}<\u002Fspan>\n<span style=\"display: block; color: #5A5170; font-size: 14px\">{{r.clinic}} · Sent {{r.sent}}<\u002Fspan>\n<\u002Fspan>\n<span style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 4px\">\n<span style=\"padding: 3px 10px; border-radius: 12px; background: {{r.bg}}; color: {{r.fg}}; font-size: 13px; font-weight: 700\">{{r.status}}<\u002Fspan>\n<span style=\"color: #5A5170; font-size: 13px\">{{r.dueLabel}}<\u002Fspan>\n<\u002Fspan>\n<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fsection>\n<aside aria-live=\"polite\" style=\"flex: 2 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<section style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 24px\">\n<h2 style=\"margin: 0 0 2px; font-size: 20px; font-weight: 700\">{{cur.title}}<\u002Fh2>\n<div style=\"color: #5A5170; margin-bottom: 18px\">{{cur.clinic}}<\u002Fdiv>\n<ol style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px\">\n<sc-for list=\"{{cur.timeline}}\" as=\"s\" hint-placeholder-count=\"3\">\n<li style=\"display: flex; gap: 12px; align-items: flex-start\">\n<span style=\"flex: 0 0 auto; width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid {{s.ring}}; background: {{s.fill}}; margin-top: 1px\"><\u002Fspan>\n<span><span style=\"font-weight: 600\">{{s.label}}<\u002Fspan> <span style=\"color: #5A5170\">{{s.date}}<\u002Fspan><\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n<\u002Fsection>\n<sc-if value=\"{{hasDraft}}\" hint-placeholder-val=\"{{true}}\">\n<section style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 24px\">\n<div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 4px\">\n<h2 style=\"margin: 0; font-size: 18px; font-weight: 700\">Follow-up draft<\u002Fh2>\n<span style=\"color: #5A5170; font-size: 13px\">Written by Everkeep<\u002Fspan>\n<\u002Fdiv>\n<div role=\"group\" aria-label=\"Format\" style=\"display: flex; border: 1px solid #B9ADD3; border-radius: 10px; overflow: hidden; margin: 8px 0 12px\">\n<sc-for list=\"{{cur.fmtBtns}}\" as=\"f\" hint-placeholder-count=\"3\">\n<button type=\"button\" sc-camel-on-click=\"{{f.pick}}\" aria-pressed=\"{{f.on}}\" style=\"flex: 1; min-height: 44px; border: none; background: {{f.bg}}; color: {{f.fg}}; font-size: 15px; font-weight: 600; cursor: pointer\">{{f.label}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 14px; margin-bottom: 14px\">{{cur.toLine}}<\u002Fdiv>\n<div style=\"box-sizing: border-box; border: 1px solid #E8E2F3; border-radius: 12px; background: #FAF8FD; padding: 18px 20px; line-height: 1.6; font-size: 14px\">\n<sc-for list=\"{{cur.draft}}\" as=\"p\" hint-placeholder-count=\"3\">\n<p style=\"margin: 0 0 10px\">{{p}}<\u002Fp>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px\">\n<button type=\"button\" sc-camel-on-click=\"{{send}}\" style=\"min-height: 44px; padding: 0 20px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">{{cur.sendLabel}}<\u002Fbutton>\n<button type=\"button\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Edit text<\u002Fbutton>\n<button type=\"button\" style=\"min-height: 44px; padding: 0 16px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Snooze 7 days<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{justSent}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"box-sizing: border-box; background: #D6EFEC; border: 1px solid #8FCBC4; border-radius: 16px; padding: 22px 24px\">\n<div style=\"font-weight: 700; color: #063F3A; margin-bottom: 4px\">{{cur.sentTitle}}<\u002Fdiv>\n<div style=\"color: #063F3A\">{{cur.sentBody}}<\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n<sc-if value=\"{{noAction}}\" hint-placeholder-val=\"{{false}}\">\n<section style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 22px 24px; color: #3B3254\">{{cur.info}}<\u002Fsection>\n<\u002Fsc-if>\n<\u002Faside>\n<\u002Fdiv>\n<p style=\"margin: 18px 4px 0; color: #5A5170; font-size: 14px\">Sample data shown for design purposes. Letters are drafts for you to review, not legal advice.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.letter}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<div style=\"margin-bottom: 16px; font-size: 14px; color: #5A5170\">\n<button type=\"button\" sc-camel-on-click=\"{{ltr.back}}\" style=\"min-height: 44px; padding: 0; border: none; background: transparent; color: #5B2FA6; font-size: 14px; font-weight: 600; cursor: pointer\">Requests<\u002Fbutton> / New request\n<\u002Fdiv>\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">Request a missing record<\u002Fh1>\n<p style=\"margin: 0 0 28px; color: #5A5170\">Everkeep fills in what it knows. Highlighted blanks are the parts only you can supply.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<section style=\"flex: 2 1 340px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 24px\">\n<div style=\"padding: 14px 16px; border-radius: 12px; background: #EFE8FB; color: #2A1553; font-size: 14px; margin-bottom: 20px\"><strong>Why this record?<\u002Fstrong> Your Aug 18 visit note mentions a Holter monitor report that is not in Everkeep yet.<\u002Fdiv>\n<div style=\"margin-bottom: 16px\">\n<label for=\"lclinic\" style=\"display: block; font-weight: 600; margin-bottom: 6px\">Clinic <span style=\"font-weight: 500; color: #5B2FA6; font-size: 13px\">Filled in<\u002Fspan><\u002Flabel>\n<input id=\"lclinic\" type=\"text\" value=\"Saguaro Heart &amp; Vascular\" readonly=\"\" style=\"box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FAF8FD; font: inherit; color: #1E1534\">\n<\u002Fdiv>\n<div style=\"margin-bottom: 16px\">\n<label for=\"lrec\" style=\"display: block; font-weight: 600; margin-bottom: 6px\">Record you need <span style=\"font-weight: 500; color: #5B2FA6; font-size: 13px\">Filled in<\u002Fspan><\u002Flabel>\n<input id=\"lrec\" type=\"text\" value=\"Holter monitor report, with the full interpretation\" readonly=\"\" style=\"box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FAF8FD; font: inherit; color: #1E1534\">\n<\u002Fdiv>\n<div style=\"margin-bottom: 16px\">\n<label for=\"lname\" style=\"display: block; font-weight: 600; margin-bottom: 6px\">Your full name<\u002Flabel>\n<input id=\"lname\" type=\"text\" placeholder=\"As the clinic knows you\" value=\"{{ltr.name}}\" sc-camel-on-change=\"{{ltr.setName}}\" style=\"box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 2px solid {{ltr.nameBd}}; border-radius: 10px; background: #FFFFFF; font: inherit; color: #1E1534\">\n<\u002Fdiv>\n<div style=\"margin-bottom: 16px\">\n<label for=\"ldob\" style=\"display: block; font-weight: 600; margin-bottom: 6px\">Date of birth<\u002Flabel>\n<input id=\"ldob\" type=\"text\" placeholder=\"MM/DD/YYYY\" value=\"{{ltr.dob}}\" sc-camel-on-change=\"{{ltr.setDob}}\" style=\"box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 2px solid {{ltr.dobBd}}; border-radius: 10px; background: #FFFFFF; font: inherit; color: #1E1534\">\n<\u002Fdiv>\n<div style=\"margin-bottom: 20px\">\n<label for=\"ldos\" style=\"display: block; font-weight: 600; margin-bottom: 6px\">Date of service<\u002Flabel>\n<input id=\"ldos\" type=\"text\" placeholder=\"Add the date\" value=\"{{ltr.dos}}\" sc-camel-on-change=\"{{ltr.setDos}}\" style=\"box-sizing: border-box; width: 100%; height: 44px; padding: 0 12px; border: 2px solid {{ltr.dosBd}}; border-radius: 10px; background: #FFFFFF; font: inherit; color: #1E1534\">\n<\u002Fdiv>\n<div style=\"font-weight: 600; margin-bottom: 8px\">Tone of the legal reminder<\u002Fdiv>\n<div role=\"group\" aria-label=\"Tone\" style=\"display: flex; border: 1px solid #B9ADD3; border-radius: 10px; overflow: hidden; margin-bottom: 8px\">\n<button type=\"button\" sc-camel-on-click=\"{{ltr.friendlyPick}}\" aria-pressed=\"{{ltr.friendlyOn}}\" style=\"flex: 1; min-height: 44px; border: none; background: {{ltr.friendlyBg}}; color: {{ltr.friendlyFg}}; font-size: 15px; font-weight: 600; cursor: pointer\">Friendly<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{ltr.firmPick}}\" aria-pressed=\"{{ltr.firmOn}}\" style=\"flex: 1; min-height: 44px; border: none; background: {{ltr.firmBg}}; color: {{ltr.firmFg}}; font-size: 15px; font-weight: 600; cursor: pointer\">Firm<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 14px\">Both versions are polite. Firm adds where to report concerns if the clinic does not respond.<\u002Fdiv>\n<\u002Fsection>\n<section style=\"flex: 3 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"font-weight: 700\">Letter preview <span style=\"font-weight: 500; color: #5E3005; font-size: 14px\">{{ltr.blanksText}}<\u002Fspan><\u002Fdiv>\n<article aria-label=\"Letter\" style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 36px 40px; line-height: 1.65\">\n<div style=\"margin-bottom: 20px\">Oct 24, 2026<\u002Fdiv>\n<div style=\"margin-bottom: 20px\">Saguaro Heart &amp; Vascular<br>Attn: Health Information Management (Medical Records)<\u002Fdiv>\n<div style=\"font-weight: 700; margin-bottom: 18px\">Re: Request for a copy of my medical records. Patient <span style=\"background: {{ltr.nameHl}}; padding: 0 6px; border-radius: 4px\">{{ltr.nameTxt}}<\u002Fspan>, date of birth <span style=\"background: {{ltr.dobHl}}; padding: 0 6px; border-radius: 4px\">{{ltr.dobTxt}}<\u002Fspan><\u002Fdiv>\n<p style=\"margin: 0 0 14px\">To the Health Information Management team,<\u002Fp>\n<p style=\"margin: 0 0 14px\">I am requesting a copy of the following from my medical record: a Holter monitor report, with the full interpretation, ordered by Dr. Marisol Vega. The date of service was <span style=\"background: {{ltr.dosHl}}; padding: 0 6px; border-radius: 4px\">{{ltr.dosTxt}}<\u002Fspan>. My Aug 18, 2026 visit note refers to this report, but I have not received it.<\u002Fp>\n<p style=\"margin: 0 0 14px\">Please send it electronically through the patient portal.<\u002Fp>\n<p style=\"margin: 0 0 14px\">{{ltr.legal}}<\u002Fp>\n<p style=\"margin: 0 0 14px\">Federal guidance on information blocking is published at healthit.gov/information-blocking.<\u002Fp>\n<p style=\"margin: 0 0 22px\">Please reply by Nov 23, 2026 with the record, or with the reason any part cannot be provided. Thank you for your help.<\u002Fp>\n<div>Sincerely,<br><span style=\"background: {{ltr.nameHl}}; padding: 0 6px; border-radius: 4px\">{{ltr.nameTxt}}<\u002Fspan><\u002Fdiv>\n<\u002Farticle>\n<div style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 20px 24px\">\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px\">\n<button type=\"button\" sc-camel-on-click=\"{{ltr.send}}\" style=\"min-height: 44px; padding: 0 22px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">Send to records department<\u002Fbutton>\n<button type=\"button\" style=\"min-height: 44px; padding: 0 18px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Copy text<\u002Fbutton>\n<button type=\"button\" style=\"min-height: 44px; padding: 0 18px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Download PDF<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 14px\">Everkeep will log this request and draft a follow-up if the clinic has not responded. Everkeep drafts letters but is not a law firm, so review the wording before you send it.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.connections}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<div style=\"display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 24px\">\n<div>\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">Connections<\u002Fh1>\n<p style=\"margin: 0; color: #5A5170\">The portals Everkeep keeps in sync for you.<\u002Fp>\n<\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{conn.add}}\" style=\"min-height: 44px; padding: 0 20px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">Connect a clinic portal<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n<section style=\"flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: 14px; border: 1px solid #DDD5EC; background: #FFFFFF\">\n<div><div style=\"font-weight: 700\">Saguaro Heart &amp; Vascular<\u002Fdiv><div style=\"color: #5A5170; font-size: 14px\">Clinic portal · Synced Oct 20<\u002Fdiv><\u002Fdiv>\n<span style=\"padding: 3px 10px; border-radius: 12px; background: #D6EFEC; color: #0A4F4A; font-size: 13px; font-weight: 700\">Connected<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: 14px; border: 1px solid #DDD5EC; background: #FFFFFF\">\n<div><div style=\"font-weight: 700\">Desert Gastro Associates<\u002Fdiv><div style=\"color: #5A5170; font-size: 14px\">Clinic portal · Synced Oct 20<\u002Fdiv><\u002Fdiv>\n<span style=\"padding: 3px 10px; border-radius: 12px; background: #D6EFEC; color: #0A4F4A; font-size: 13px; font-weight: 700\">Connected<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: 14px; border: 1px solid #DDD5EC; background: #FFFFFF\">\n<div><div style=\"font-weight: 700\">{{conn.mesaName}}<\u002Fdiv><div style=\"color: #5A5170; font-size: 14px\">{{conn.mesaSub}}<\u002Fdiv><\u002Fdiv>\n<sc-if value=\"{{conn.mesaOn}}\" hint-placeholder-val=\"{{false}}\">\n<span style=\"padding: 3px 10px; border-radius: 12px; background: #D6EFEC; color: #0A4F4A; font-size: 13px; font-weight: 700\">Connected<\u002Fspan>\n<\u002Fsc-if>\n<sc-if value=\"{{conn.mesaOff}}\" hint-placeholder-val=\"{{true}}\">\n<button type=\"button\" sc-camel-on-click=\"{{conn.add}}\" style=\"min-height: 44px; padding: 0 18px; border: 1px solid #5B2FA6; border-radius: 10px; background: #FFFFFF; color: #43207F; font-size: 15px; font-weight: 600; cursor: pointer\">Connect<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsection>\n<aside style=\"flex: 2 1 320px; min-width: 0; box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 24px\">\n<h2 style=\"margin: 0 0 6px; font-size: 18px; font-weight: 700\">Browser extension<\u002Fh2>\n<p style=\"margin: 0 0 16px; color: #3B3254\">Installed. It notices when you sign in to a medical or imaging portal and asks if you want to connect it.<\u002Fp>\n<button type=\"button\" sc-camel-on-click=\"{{conn.demoExt}}\" style=\"min-height: 44px; padding: 0 18px; border: 1px solid #5B2FA6; border-radius: 10px; background: #FFFFFF; color: #43207F; font-size: 15px; font-weight: 600; cursor: pointer\">Try it on a pretend portal<\u002Fbutton>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.connectPick}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<div style=\"margin-bottom: 16px; font-size: 14px; color: #5A5170\">\n<button type=\"button\" sc-camel-on-click=\"{{nav.goConnections}}\" style=\"min-height: 44px; padding: 0; border: none; background: transparent; color: #5B2FA6; font-size: 14px; font-weight: 600; cursor: pointer\">Connections<\u002Fbutton> / Connect a clinic portal\n<\u002Fdiv>\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">Connect a clinic portal<\u002Fh1>\n<p style=\"margin: 0 0 24px; color: #5A5170\">Choose where your records live. This prototype connects to a simulated Mesa Valley Health.<\u002Fp>\n<label for=\"csearch\" style=\"display: block; font-weight: 600; margin-bottom: 6px\">Find your clinic<\u002Flabel>\n<input id=\"csearch\" type=\"search\" placeholder=\"Search clinics and hospitals\" style=\"box-sizing: border-box; width: 100%; max-width: 460px; height: 44px; padding: 0 14px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; font: inherit; color: #1E1534; margin-bottom: 20px\">\n<div style=\"display: flex; flex-direction: column; gap: 10px; max-width: 760px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: 14px; border: 1px solid #DDD5EC; background: #FFFFFF\">\n<div><div style=\"font-weight: 700\">Mesa Valley Health<\u002Fdiv><div style=\"color: #5A5170; font-size: 14px\">Patient Portal · Mesa, AZ<\u002Fdiv><\u002Fdiv>\n<button type=\"button\" sc-camel-on-click=\"{{pick.mesa}}\" style=\"min-height: 44px; padding: 0 20px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 600; cursor: pointer\">Connect<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: 14px; border: 1px solid #DDD5EC; background: #FAF8FD\">\n<div><div style=\"font-weight: 700\">Sonoran Family Medicine<\u002Fdiv><div style=\"color: #5A5170; font-size: 14px\">Patient Portal · Not available in this prototype<\u002Fdiv><\u002Fdiv>\n<button type=\"button\" disabled=\"\" style=\"min-height: 44px; padding: 0 20px; border: 1px solid #DDD5EC; border-radius: 10px; background: #FFFFFF; color: #6B6280; font-size: 15px; font-weight: 600\">Connect<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 20px; border-radius: 14px; border: 1px solid #DDD5EC; background: #FAF8FD\">\n<div><div style=\"font-weight: 700\">Valley Imaging Partners<\u002Fdiv><div style=\"color: #5A5170; font-size: 14px\">Imaging portal · Not available in this prototype<\u002Fdiv><\u002Fdiv>\n<button type=\"button\" disabled=\"\" style=\"min-height: 44px; padding: 0 20px; border: 1px solid #DDD5EC; border-radius: 10px; background: #FFFFFF; color: #6B6280; font-size: 15px; font-weight: 600\">Connect<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<p style=\"margin: 20px 0 0; color: #5A5170\">Do not see your clinic? Type the name into the search bar above.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.wizard}}\" hint-placeholder-val=\"{{false}}\">\n<div>\n<ol aria-label=\"Progress\" style=\"display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0 0 32px; padding: 0; list-style: none\">\n<sc-for list=\"{{steps}}\" as=\"st\" hint-placeholder-count=\"4\">\n<li style=\"display: flex; align-items: center; gap: 10px\">\n<span style=\"width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid {{st.bd}}; background: {{st.bg}}; color: {{st.fg}}; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center\">{{st.mark}}<\u002Fspan>\n<span style=\"font-weight: {{st.fw}}; color: {{st.tc}}\">{{st.label}}<\u002Fspan>\n<\u002Fli>\n<\u002Fsc-for>\n<\u002Fol>\n\n<sc-if value=\"{{v.connectAuth}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"max-width: 640px\">\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 36px; letter-spacing: -0.01em\">Allow Everkeep to read your records<\u002Fh1>\n<p style=\"margin: 0 0 24px; color: #5A5170\">Mesa Valley Health will ask you to approve this connection. You can disconnect at any time.<\u002Fp>\n<div style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 28px\">\n<div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 22px\">\n<span style=\"width: 44px; height: 44px; border-radius: 12px; background: #5B2FA6; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center\">E<\u002Fspan>\n<span aria-hidden=\"true\" style=\"color: #5A5170; font-size: 22px\">↔<\u002Fspan>\n<span style=\"width: 44px; height: 44px; border-radius: 12px; background: #274C77; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center\">M<\u002Fspan>\n<span style=\"font-weight: 700\">Everkeep wants to connect to Mesa Valley Health<\u002Fspan>\n<\u002Fdiv>\n<div style=\"font-weight: 600; margin-bottom: 8px\">Read-only access to<\u002Fdiv>\n<ul style=\"margin: 0 0 20px; padding: 0; list-style: none; border: 1px solid #E8E2F3; border-radius: 12px; overflow: hidden\">\n<li style=\"padding: 12px 16px; border-bottom: 1px solid #E8E2F3\">Lab results<\u002Fli>\n<li style=\"padding: 12px 16px; border-bottom: 1px solid #E8E2F3\">Visit notes and summaries<\u002Fli>\n<li style=\"padding: 12px 16px; border-bottom: 1px solid #E8E2F3\">Medications and immunizations<\u002Fli>\n<li style=\"padding: 12px 16px\">Imaging reports and images<\u002Fli>\n<\u002Ful>\n<div style=\"padding: 12px 14px; border-radius: 10px; background: #F6F3FB; color: #3B3254; font-size: 14px; margin-bottom: 22px\">Simulated connection for this prototype. It talks to a pretend API at api.mesavalley.example. No real records are used.<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<button type=\"button\" sc-camel-on-click=\"{{auth.allow}}\" style=\"min-height: 46px; padding: 0 24px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer\">Allow access<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{auth.cancel}}\" style=\"min-height: 46px; padding: 0 20px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Cancel<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.wizImport}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"max-width: 720px\">\n<h1 style=\"margin: 0 0 4px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 36px; letter-spacing: -0.01em\">{{imp.title}}<\u002Fh1>\n<p style=\"margin: 0 0 24px; color: #5A5170\">{{imp.sub}}<\u002Fp>\n<div style=\"box-sizing: border-box; background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; padding: 28px\">\n<div style=\"display: flex; justify-content: space-betwe >\n<button type=\"button\" sc-camel-on-click=\"{{rv.allCard}}\" aria-pressed=\"{{rv.allCardOn}}\" style=\"min-height: 44px; padding: 0 16px; border-radius: 22px; border: 2px solid {{rv.allCardBd}}; background: {{rv.allCardBg}}; color: {{rv.allCardFg}}; font-size: 15px; font-weight: 600; cursor: pointer\">{{rv.allCardMark}} Cardiology<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsection>\n<section style=\"background: #FFFFFF; border: 1px solid #DDD5EC; border-radius: 16px; overflow-x: auto\">\n<div style=\"min-width: 640px\">\n<div style=\"display: grid; grid-template-columns: 56px 110px minmax(0, 1.6fr) minmax(0, 1.4fr); column-gap: 12px; padding: 14px 20px; border-bottom: 1px solid #DDD5EC; color: #5A5170; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase\">\n<div>Keep<\u002Fdiv><div>Date<\u002Fdiv><div>Record<\u002Fdiv><div>Tags<\u002Fdiv>\n<\u002Fdiv>\n<sc-for list=\"{{rv.rows}}\" as=\"r\" hint-placeholder-count=\"8\">\n<div style=\"display: grid; grid-template-columns: 56px 110px minmax(0, 1.6fr) minmax(0, 1.4fr); column-gap: 12px; align-items: center; min-height: 64px; padding: 8px 20px; border-bottom: 1px solid #EDE8F6; background: {{r.bg}}\">\n<div><input type=\"checkbox\" checked=\"{{r.inc}}\" sc-camel-on-change=\"{{r.toggleInc}}\" aria-label=\"Keep {{r.title}}\" style=\"width: 22px; height: 22px; accent-color: #5B2FA6\"><\u002Fdiv>\n<div style=\"color: #5A5170\">{{r.date}}<\u002Fdiv>\n<div>\n<div style=\"font-weight: 600\">{{r.title}}<\u002Fdiv>\n<div style=\"color: #5A5170; font-size: 13px\">{{r.kind}}<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n<button type=\"button\" sc-camel-on-click=\"{{r.togglePots}}\" aria-pressed=\"{{r.potsOn}}\" style=\"min-height: 44px; padding: 0 12px; border-radius: 22px; border: 2px solid {{r.potsBd}}; background: {{r.potsBg}}; color: {{r.potsFg}}; font-size: 13px; font-weight: 600; cursor: pointer\">{{r.potsMark}} POTS<\u002Fbutton>\n<button type=\"button\" sc-cam ght: 700; cursor: pointer; margin-bottom: 10px\">{{rv.confirmLabel}}<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{rv.cancel}}\" style=\"width: 100%; min-height: 44px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">Cancel import<\u002Fbutton>\n<div style=\"margin-top: 12px; color: #5A5170; font-size: 13px\">You can edit clinic names and tags later from any record.<\u002Fdiv>\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{v.wizDone}}\" hint-placeholder-val=\"{{false}}\">\n<div style=\"max-width: 640px\">\n<div style=\"width: 56px; height: 56px; border-radius: 28px; background: #D6EFEC; display: flex; align-items: center; justify-content: center; margin-bottom: 18px\">\n<svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0A4F4A\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<h1 style=\"margin: 0 0 8px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; letter-spacing: -0.01em\">{{dn.title}}<\u002Fh1>\n<p style=\"margin: 0 0 24px; color: #3B3254; font-size: 17px\">{{dn.sub}}<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n<button type=\"button\" sc-camel-on-click=\"{{dn.records}}\" style=\"min-height: 46px; padding: 0 22px; border: none; border-radius: 10px; background: #5B2FA6; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer\">View your records<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{dn.labs}}\" style=\"min-height: 46px; padding: 0 22px; border: 1px solid #B9ADD3; border-radius: 10px; background: #FFFFFF; color: #1E1534; font-size: 15px; font-weight: 600; cursor: pointer\">See your TSH trend<\u002Fbutton>\n<button type=\"button\" sc-camel-on-click=\"{{dn.home}}\" style=\"min-height: 46px; padding: 0 ) + 4);\n      this.setState({ progress: p });\n      if (p >= 100) { this.stopTimer(); }\n    }, 120);\n  }\n\n  renderVals() {\n    const s = this.S();\n    const self = this;\n    const TAGS = {\n      pots: { label: 'POTS', bg: '#D6EFEC', fg: '#0A4F4A' },\n      gast: { label: 'Gastroparesis', bg: '#FFE6D2', fg: '#7A3208' },\n      card: { label: 'Cardiology', bg: '#FBE0EC', fg: '#7A1740' }\n    };\n    (s.customTags || []).forEach((t) => { TAGS[t.key] = t; });\n    const BASE = [\n      { id: 'b1', t: 20260929, date: 'Sep 29, 2026', title: 'Tilt table test report', kind: 'Cardiology', clinic: 'Saguaro Heart & Vascular', tags: ['pots', 'card'] },\n      { id: 'b2', t: 20260902, date: 'Sep 2, 2026', title: 'Gastric emptying study, 4 hour', kind: 'Nuclear medicine', clinic: 'Desert Gastro Associates', tags: ['gast'], study: 'gast' },\n      { id: 'b3', t: 20260818, date: 'Aug 18, 2026', title: 'Autonomic follow-up visit note', kind: 'Visit note', clinic: 'Saguaro Heart & Vascular', tags: ['pots'] },\n      { id: 'b4', t: 20260611, date: 'Jun 11, 2026', title: 'Upper GI endoscopy report', kind: 'Procedure', clinic: 'Desert Gastro Associates', tags: ['gast'] },\n      { id: 'b5', t: 20260409, date: 'Apr 9, 2026', title: 'Thyroid panel (TSH, free T4)', kind: 'Lab results', clinic: 'Saguaro Heart & Vascular', tags: [], lab: 'tsh' }\n    ];\n    const MESA = [\n      { id: 'm1', t: 20261014, date: 'Oct 14, 2026', title: 'TSH', kind: 'Lab results', mesa: true, tags: [], lab: 'tsh' },\n      { id: 'm2', t: 20261014, date: 'Oct 14, 2026', title: 'Lipid panel', kind: 'Lab results', mesa: true, tags: [], lab: 'chol' },\n      { id: 'm3', t: 20261014, date: 'Oct 14, 2026', title: 'Comprehensive metabolic panel', kind: 'Lab results', mesa: true, tags: [] },\n      { id: 'm4', t: 20260730, date: 'Jul 30, 2026', title: 'Ferritin and iron panel', kind: 'Lab results', mesa: true, tags: [], lab: 'ferr' },\n      { id: 'm5', t: 20260603, date: 'Jun 3, 2026', title: 'Primary care vi
